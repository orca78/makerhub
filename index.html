<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MakerHub</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --muted:#9aa3b2; --accent:#00c2a8; --danger:#ff5c6c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; padding:14px 24px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .logo { font-size:1.4rem; font-weight:700; color:var(--accent); cursor:pointer; }
  nav, .userbox { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  button, .btn { background:var(--accent); color:#001b17; border:0; border-radius:8px; padding:9px 16px; font-weight:600; cursor:pointer; font-size:.95rem; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button.danger { background:var(--danger); color:#fff; }
  button:hover { filter:brightness(1.1); }
  main { max-width:1100px; margin:0 auto; padding:24px; }
  h1,h2 { margin-top:0; }
  .hidden { display:none !important; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:24px; max-width:520px; margin:0 auto; }
  label { display:block; margin:14px 0 6px; color:var(--muted); font-size:.9rem; }
  input, select, textarea { width:100%; padding:10px 12px; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  input:focus, select:focus, textarea:focus { outline:2px solid var(--accent); border-color:transparent; }
  .msg { margin-top:14px; padding:10px 12px; border-radius:8px; font-size:.9rem; display:none; }
  .msg.err { display:block; background:#3a1a1f; color:#ff9aa5; }
  .msg.ok { display:block; background:#12332e; color:#7de8d8; }
  .toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .toolbar input { flex:1; min-width:200px; } .toolbar select { width:200px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .card img { width:100%; height:180px; object-fit:cover; background:#222; }
  .card .body { padding:16px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .card h3 { margin:0; }
  .card p { margin:0; color:var(--muted); font-size:.92rem; }
  .tags { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:2px 10px; font-size:.78rem; color:var(--muted); }
  .meta { display:flex; justify-content:space-between; font-size:.82rem; color:var(--muted); margin-top:auto; }
  .hint { color:var(--muted); font-size:.82rem; margin-top:18px; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  a.link { color:var(--accent); cursor:pointer; }
</style>
</head>
<body>

<header>
  <div class="logo" id="logo">🔧 MakerHub</div>
  <nav>
    <button class="ghost" data-view="projects">Projekte</button>
    <button class="ghost" data-view="new">+ Neues Projekt</button>
  </nav>
  <div class="userbox">
    <span id="userLabel"></span>
    <button class="ghost" id="btnLogin" data-view="login">Anmelden</button>
    <button id="btnRegister" data-view="register">Registrieren</button>
    <button class="ghost hidden" id="btnLogout">Abmelden</button>
  </div>
</header>

<main>
  <!-- PROJEKTE -->
  <section id="view-projects">
    <h1>Projekte</h1>
    <div class="toolbar">
      <input type="search" id="search" placeholder="Suchen …">
      <select id="filterLevel">
        <option value="">Alle Schwierigkeiten</option>
        <option>Einfach</option><option>Mittel</option><option>Schwer</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- LOGIN -->
  <section id="view-login" class="hidden">
    <div class="box">
      <h2>Anmelden</h2>
      <form id="loginForm" novalidate>
        <label for="loginEmail">E-Mail</label>
        <input id="loginEmail" type="email" autocomplete="email">
        <label for="loginPw">Passwort</label>
        <input id="loginPw" type="password" autocomplete="current-password">
        <div style="margin-top:18px"><button type="submit">Anmelden</button></div>
        <div id="loginMsg" class="msg"></div>
      </form>
      <p class="hint">Noch kein Konto? <a class="link" data-view="register">Jetzt registrieren</a></p>
    </div>
  </section>

  <!-- REGISTRIERUNG -->
  <section id="view-register" class="hidden">
    <div class="box">
      <h2>Registrieren</h2>
      <form id="registerForm" novalidate>
        <label for="regName">Name</label>
        <input id="regName" type="text" autocomplete="nickname">
        <label for="regEmail">E-Mail</label>
        <input id="regEmail" type="email" autocomplete="email">
        <label for="regPw">Passwort (mind. 6 Zeichen)</label>
        <input id="regPw" type="password" autocomplete="new-password">
        <label for="regPw2">Passwort wiederholen</label>
        <input id="regPw2" type="password" autocomplete="new-password">
        <div style="margin-top:18px"><button type="submit">Konto erstellen</button></div>
        <div id="regMsg" class="msg"></div>
      </form>
      <p class="hint">Bereits registriert? <a class="link" data-view="login">Zur Anmeldung</a></p>
    </div>
  </section>

  <!-- NEUES PROJEKT -->
  <section id="view-new" class="hidden">
    <div class="box">
      <h2>Neues Projekt</h2>
      <form id="projectForm" novalidate>
        <label for="pTitel">Titel *</label>
        <input id="pTitel" type="text" maxlength="80">
        <label for="pBeschr">Beschreibung *</label>
        <textarea id="pBeschr"></textarea>
        <label for="pMat">Materialien (mit Komma getrennt)</label>
        <input id="pMat" type="text" placeholder="ESP32, Sensor, Display">
        <label for="pZeit">Bauzeit</label>
        <input id="pZeit" type="text" placeholder="z. B. 2 Stunden">
        <label for="pLevel">Schwierigkeit</label>
        <select id="pLevel"><option>Einfach</option><option selected>Mittel</option><option>Schwer</option></select>
        <label for="pFile">Bild hochladen (wird verkleinert)</label>
        <input id="pFile" type="file" accept="image/*">
        <label for="pUrl">… oder Bild-URL (https://…)</label>
        <input id="pUrl" type="url" placeholder="https://…">
        <div style="margin-top:18px"><button type="submit">Projekt veröffentlichen</button></div>
        <div id="projMsg" class="msg"></div>
      </form>
    </div>
  </section>
</main>

<script>
(function () {
  "use strict";

  // ---------- Hilfsfunktionen ----------
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };

  function load(key, fallback) {
    try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch (e) { return false; }
  }
  function msg(el, text, type) {
    el.textContent = text || "";
    el.className = "msg" + (text ? " " + type : "");
  }
  async function hashPw(pw) {
    if (window.crypto && crypto.subtle) {
      var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("makerhub:" + pw));
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
    }
    return btoa(unescape(encodeURIComponent(pw)));
  }

  var PLACEHOLDER = "data:image/svg+xml," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#232833"/>' +
    '<text x="50%" y="50%" fill="#9aa3b2" font-family="Arial" font-size="22" text-anchor="middle" dominant-baseline="middle">Kein Bild</text></svg>');

  function safeImg(url) {
    if (typeof url === "string" && (/^https:\/\//i.test(url) || /^data:image\//i.test(url))) return url;
    return PLACEHOLDER;
  }

  // ---------- Daten ----------
  var users = load("mh_users", []);
  var session = load("mh_session", null);   // E-Mail des angemeldeten Nutzers
  var projects = load("mh_projects", null);
  if (!projects) {
    projects = [
      { id: 1, titel: "ESP32-Wetterstation", beschreibung: "Misst Temperatur, Luftfeuchtigkeit und Luftdruck und zeigt die Werte auf einem OLED-Display an.",
        materialien: ["ESP32", "BME280-Sensor", "OLED-Display"], bauzeit: "2 Stunden", schwierigkeit: "Mittel", bild: "", autor: "MakerHub", autorEmail: "" },
      { id: 2, titel: "3D-gedruckter Roboterarm", beschreibung: "Ein steuerbarer Roboterarm aus gedruckten Teilen und Servomotoren – ideal für den Unterricht.",
        materialien: ["3D-Drucker", "Servomotoren", "Arduino"], bauzeit: "4 Stunden", schwierigkeit: "Schwer", bild: "", autor: "MakerHub", autorEmail: "" }
    ];
    save("mh_projects", projects);
  }

  function currentUser() {
    return users.find(function (u) { return u.email === session; }) || null;
  }

  // ---------- Ansichten ----------
  function show(view) {
    if (view === "new" && !currentUser()) {
      view = "login";
      msg($("#loginMsg"), "Bitte melde dich an, um ein Projekt zu erstellen.", "err");
    }
    $$("main > section").forEach(function (s) { s.classList.add("hidden"); });
    $("#view-" + view).classList.remove("hidden");
    if (view === "projects") renderProjects();
    window.scrollTo(0, 0);
  }

  function updateHeader() {
    var u = currentUser();
    $("#userLabel").textContent = u ? "👤 " + u.name : "";
    $("#btnLogin").classList.toggle("hidden", !!u);
    $("#btnRegister").classList.toggle("hidden", !!u);
    $("#btnLogout").classList.toggle("hidden", !u);
  }

  // Alle Elemente mit data-view reagieren auf Klick
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-view]");
    if (el) { e.preventDefault(); show(el.getAttribute("data-view")); }
  });
  $("#logo").addEventListener("click", function () { show("projects"); });

  // ---------- Projekte anzeigen ----------
  function renderProjects() {
    var grid = $("#grid");
    var q = $("#search").value.trim().toLowerCase();
    var lvl = $("#filterLevel").value;
    grid.innerHTML = "";

    var list = projects.filter(function (p) {
      var hay = (p.titel + " " + p.beschreibung + " " + (p.materialien || []).join(" ")).toLowerCase();
      return (!q || hay.indexOf(q) !== -1) && (!lvl || p.schwierigkeit === lvl);
    });

    if (!list.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Keine Projekte gefunden.";
      grid.appendChild(empty);
      return;
    }
    list.slice().reverse().forEach(function (p) { grid.appendChild(card(p)); });
  }

  function card(p) {
    var el = document.createElement("article");
    el.className = "card";

    var img = new Image();
    img.alt = p.titel;
    img.src = safeImg(p.bild);
    img.onerror = function () { img.onerror = null; img.src = PLACEHOLDER; };
    el.appendChild(img);

    var body = document.createElement("div");
    body.className = "body";

    var h = document.createElement("h3"); h.textContent = p.titel; body.appendChild(h);
    var d = document.createElement("p"); d.textContent = p.beschreibung; body.appendChild(d);

    if (p.materialien && p.materialien.length) {
      var tags = document.createElement("div"); tags.className = "tags";
      p.materialien.forEach(function (m) {
        var t = document.createElement("span"); t.className = "tag"; t.textContent = m; tags.appendChild(t);
      });
      body.appendChild(tags);
    }

    var meta = document.createElement("div"); meta.className = "meta";
    var l = document.createElement("span"); l.textContent = "⏱ " + (p.bauzeit || "–") + " · " + p.schwierigkeit;
    var r = document.createElement("span"); r.textContent = "von " + p.autor;
    meta.appendChild(l); meta.appendChild(r);
    body.appendChild(meta);

    var u = currentUser();
    if (u && p.autorEmail && p.autorEmail === u.email) {
      var del = document.createElement("button");
      del.className = "danger"; del.textContent = "Löschen";
      del.addEventListener("click", function () {
        if (confirm("Projekt wirklich löschen?")) {
          projects = projects.filter(function (x) { return x.id !== p.id; });
          save("mh_projects", projects);
          renderProjects();
        }
      });
      body.appendChild(del);
    }
    el.appendChild(body);
    return el;
  }

  $("#search").addEventListener("input", renderProjects);
  $("#filterLevel").addEventListener("change", renderProjects);

  // ---------- Registrierung ----------
  $("#registerForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var out = $("#regMsg");
    try {
      var name = $("#regName").value.trim();
      var email = $("#regEmail").value.trim().toLowerCase();
      var pw = $("#regPw").value;
      var pw2 = $("#regPw2").value;

      if (!name) return msg(out, "Bitte gib einen Namen ein.", "err");
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return msg(out, "Bitte gib eine gültige E-Mail-Adresse ein.", "err");
      if (pw.length < 6) return msg(out, "Das Passwort muss mindestens 6 Zeichen lang sein.", "err");
      if (pw !== pw2) return msg(out, "Die Passwörter stimmen nicht überein.", "err");
      if (users.some(function (u) { return u.email === email; })) return msg(out, "Diese E-Mail ist schon registriert.", "err");

      users.push({ name: name, email: email, pw: await hashPw(pw) });
      if (!save("mh_users", users)) return msg(out, "Speichern im Browser nicht möglich (Privatmodus?).", "err");

      session = email;
      save("mh_session", session);
      e.target.reset();
      msg(out, "", "");
      updateHeader();
      show("projects");
    } catch (err) {
      msg(out, "Unerwarteter Fehler: " + err.message, "err");
      console.error(err);
    }
  });

  // ---------- Anmeldung ----------
  $("#loginForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var out = $("#loginMsg");
    try {
      var email = $("#loginEmail").value.trim().toLowerCase();
      var h = await hashPw($("#loginPw").value);
      var u = users.find(function (x) { return x.email === email && x.pw === h; });
      if (!u) return msg(out, "E-Mail oder Passwort falsch.", "err");
      session = u.email;
      save("mh_session", session);
      e.target.reset();
      msg(out, "", "");
      updateHeader();
      show("projects");
    } catch (err) {
      msg(out, "Unerwarteter Fehler: " + err.message, "err");
      console.error(err);
    }
  });

  $("#btnLogout").addEventListener("click", function () {
    session = null;
    localStorage.removeItem("mh_session");
    updateHeader();
    show("projects");
  });

  // ---------- Neues Projekt ----------
  function fileToDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = function () { reject(new Error("Datei konnte nicht gelesen werden.")); };
      reader.onload = function () {
        var im = new Image();
        im.onerror = function () { reject(new Error("Das ist keine gültige Bilddatei.")); };
        im.onload = function () {
          var max = 800, w = im.width, h = im.height;
          var s = Math.min(1, max / Math.max(w, h));
          var c = document.createElement("canvas");
          c.width = Math.round(w * s); c.height = Math.round(h * s);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          resolve(c.toDataURL("image/jpeg", 0.8));
        };
        im.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  $("#projectForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var out = $("#projMsg");
    try {
      var u = currentUser();
      if (!u) return show("login");

      var titel = $("#pTitel").value.trim();
      var beschr = $("#pBeschr").value.trim();
      if (!titel || !beschr) return msg(out, "Titel und Beschreibung sind Pflichtfelder.", "err");

      var bild = $("#pUrl").value.trim();
      var file = $("#pFile").files[0];
      if (file) bild = await fileToDataUrl(file);
      if (bild && !/^https:\/\//i.test(bild) && !/^data:image\//i.test(bild))
        return msg(out, "Die Bild-URL muss mit https:// beginnen.", "err");

      projects.push({
        id: Date.now(),
        titel: titel,
        beschreibung: beschr,
        materialien: $("#pMat").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
        bauzeit: $("#pZeit").value.trim(),
        schwierigkeit: $("#pLevel").value,
        bild: bild,
        autor: u.name,
        autorEmail: u.email
      });

      if (!save("mh_projects", projects)) {
        projects.pop();
        return msg(out, "Speicher voll – nimm ein kleineres Bild oder eine Bild-URL.", "err");
      }
      e.target.reset();
      msg(out, "", "");
      show("projects");
    } catch (err) {
      msg(out, "Fehler: " + err.message, "err");
      console.error(err);
    }
  });

  // ---------- Start ----------
  updateHeader();
  show("projects");
})();
</script>
</body>
</html>
